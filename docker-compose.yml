version: "3.9"

services:
  ollama:
    image: ollama/ollama:latest
    container_name: esg_ollama
    ports:
      - "11434:11434"
    volumes:
      - esg_ollama:/root/.ollama
    environment:
      - OLLAMA_HOST=0.0.0.0
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11434/api/tags"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  esg-backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: esg_backend
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --no-access-log
    ports:
      - "8000:8000"
    volumes:
      - ./:/app
    environment:
      - OLLAMA_BASE_URL=http://ollama:11434
      - OLLAMA_MODEL=qwen2:1.5b
      - OLLAMA_EMBED_MODEL=nomic-embed-text
      - SERPAPI_KEY=${SERPAPI_KEY}
      - NASA_API_KEY=${NASA_API_KEY}
      - REPORTS_DIR=/app/reports
      - LANGSMITH_TRACING_V2=true
      - LANGSMITH_API_KEY=${LANGSMITH_API_KEY}
      - LANGSMITH_ENDPOINT=https://eu.api.smith.langchain.com
      - LANGSMITH_PROJECT=esg_auditor
    restart: unless-stopped

  esg-ui:
    build:
      context: .
      dockerfile: Dockerfile.ui
    container_name: esg_ui
    ports:
      - "8501:8501"
    volumes:
      - ./ui:/app/ui
      - ./reports:/app/reports
    environment:
      - BACKEND_URL=http://esg-backend:8000
    restart: unless-stopped

volumes:
  esg_ollama: