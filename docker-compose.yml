# version: "3.9"

services:
  # ─── Local LLM Server ───────────────────────────────────────────────────────
  ollama:
    image: ollama/ollama:latest
    container_name: esg_ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    environment:
      - OLLAMA_HOST=0.0.0.0
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11434/api/tags"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    deploy: # remove this if you do not have gpu when running application
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    restart: unless-stopped 

  # ─── Model Initialiser (runs once, pulls required models) ───────────────────
  ollama-init:
    image: ollama/ollama:latest
    container_name: esg_ollama_init
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      - OLLAMA_HOST=http://ollama:11434
    entrypoint: >
      /bin/sh -c "
        ollama pull mistral:7b-instruct &&
        ollama pull nomic-embed-text &&
        echo 'Models ready.'
      "
    restart: "no"

  # ─── ESG Agent Backend (FastAPI) ────────────────────────────────────────────
  esg-backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: esg_backend
    ports:
      - "8000:8000"
    volumes:
      - ./reports:/app/reports
      - ./data:/app/data
      - ./config:/app/config
    environment:
      - OLLAMA_BASE_URL=http://ollama:11434
      - OLLAMA_MODEL=mistral:7b-instruct
      - OLLAMA_EMBED_MODEL=nomic-embed-text
      - SERPAPI_KEY=${SERPAPI_KEY:-}
      - NASA_API_KEY=${NASA_API_KEY:-DEMO_KEY}
      - REPORTS_DIR=/app/reports
      # ----LangSmith Tracing---- used for tracing what the llm does add llm API key if not running local llm
      - LANGSMITH_TRACING_V2=true
      - LANGSMITH_API_KEY=YOUR_API_KEY_HERE
      - LANGSMITH_ENDPOINT=https://eu.api.smith.langchain.com # depends on the location where you are running
      - LANGSMITH_PROJECT=NAME_OF_YOUR_PROJECT
    depends_on:
      ollama:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ─── Streamlit UI ───────────────────────────────────────────────────────────
  esg-ui:
    build:
      context: .
      dockerfile: Dockerfile.ui
    container_name: esg_ui
    ports:
      - "8501:8501"
    volumes:
      - ./reports:/app/reports
    environment:
      - BACKEND_URL=http://esg-backend:8000
    depends_on:
      esg-backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  ollama_data:
